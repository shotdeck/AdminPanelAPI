<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>BTS Admin · ShotDeck</title>
    <link rel="stylesheet" href="css/bts.css?v=4">
</head>
<body>
<header class="top">
    <img src="assets/shotdeck_logo.png" alt="ShotDeck" class="logo-img">
    <span class="product">BTS <span class="muted">Admin</span></span>
    <span class="spacer"></span>
    <span id="who" class="muted"></span>
    <button id="logout" type="button" class="hidden">Sign out</button>
</header>
<main>
    <form id="login" class="card center-card stack hidden">
        <img src="assets/shotdeck_logo.png" alt="ShotDeck" class="logo-img">
        <h2>Sign in to BTS</h2>
        <input id="login-name" placeholder="Name" autocomplete="username" required>
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
        <div id="login-error" class="error"></div>
        <button type="submit" class="primary">Sign in</button>
    </form>

    <section id="spaces" class="hidden">
        <div class="page-head">
            <h2>Customer spaces</h2>
            <input id="filter" type="search" placeholder="Search by name or notes">
            <button id="new-space" type="button" class="primary">New space</button>
        </div>
        <div class="card flush">
            <table class="list">
                <thead><tr><th>Name</th><th>Status</th><th class="hide-sm">Expires</th><th class="hide-sm">Created</th><th></th></tr></thead>
                <tbody id="space-rows"></tbody>
            </table>
            <div id="spaces-empty" class="muted hidden">No spaces yet. Create one for a customer to get their link.</div>
        </div>
    </section>

    <section id="space" class="hidden">
        <button id="back" type="button" class="link back">&larr; All spaces</button>
        <div class="card space-head">
            <div class="title-row">
                <h2 id="space-title"></h2>
                <span id="space-status" class="badge"></span>
                <span id="space-usage" class="usage"></span>
            </div>
            <div id="space-meta" class="muted"></div>
            <div id="space-notes" class="notes hidden"></div>
            <div class="space-actions">
                <div class="group">
                    <button id="share-link" type="button" class="primary">Share link</button>
                    <button id="zip-space" type="button" title="Download everything in this space as a zip">Download all</button>
                </div>
                <div class="group secondary">
                    <button id="edit-space" type="button">Edit details</button>
                    <button id="rotate-link" type="button" title="Replace the link. The current one stops working.">New link</button>
                    <button id="revoke-link" type="button" class="danger">Turn off link</button>
                </div>
            </div>
            <div id="share-box" class="stack hidden">
                <div class="muted">Send this link to the customer. Anyone with it can open this space.</div>
                <div class="linkbox">
                    <input id="space-link" readonly>
                    <button id="copy-link" type="button">Copy link</button>
                </div>
            </div>
        </div>
        <div class="tabs">
            <button type="button" data-tab="files" class="active">Files</button>
            <button type="button" data-tab="trash">Trash</button>
            <button type="button" data-tab="activity">Activity</button>
        </div>
        <div id="tab-files"></div>
        <div id="tab-trash" class="card hidden"></div>
        <div id="tab-activity" class="card hidden"></div>
    </section>
</main>
<script src="js/config.js?v=1"></script>
<script src="js/common.js?v=3"></script>
<script src="js/browser.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
</body>
</html>
